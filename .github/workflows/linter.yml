name: Auto-format code

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  auto-format:
    name: Auto-format with Ruff
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'auto-format')"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # Use the project's pinned ruff (from uv.lock) so CI formatting matches
        # local pre-commit and never drifts from a floating latest release.
        run: uv sync --extra dev

      - name: Format code with Ruff
        run: |
          uv run ruff format .
          uv run ruff check --fix .

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: auto-format code with ruff [skip ci]"
            git push
          else
            echo "No formatting changes needed"
          fi
